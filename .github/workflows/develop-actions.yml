# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: '17.x'
      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
      - run: node --test test/webview_widget/*.test.cjs
      - run: flutter pub get
      - run: dart run build_runner clean
      - run: dart run build_runner build
      - run: flutter test --concurrency=1
      - run: flutter analyze
      # Compile the migrated Android example; unit tests do not evaluate Gradle
      # repositories, Kotlin configuration or manifest namespace migration.
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: example
      # Code generation modifies tracked sources; keep publishing warnings visible.
      - run: dart pub publish --dry-run --ignore-warnings

  minimum-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter-version: '3.35.0'
      - run: dart tool/check_minimum_consumer.dart
