name: chatwoot_sdk
description: A flutter client sdk for chatwoot. Integrate Chatwoot flutter client into your flutter app and talk to your visitors/users in real time.
version: 0.0.9
homepage: https://github.com/chatwoot/chatwoot-flutter-sdk

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3
  json_annotation: ^4.11.0
  dio: ^5.9.2
  equatable: ^2.0.8
  riverpod: ^3.2.1
  synchronized: ^3.4.0
  intl: ^0.20.2
  stream_channel: ^2.1.4
  async: ^2.13.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_inappwebview: ^6.0.0
dependency_overrides:
  web_socket_channel: ^3.0.3
  archive: 4.0.9
  source_gen: ^4.1.1
  build: ^4.0.4
  meta: ^1.17.0
  flutter_plugin_android_lifecycle: 2.0.33
dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.3.2
  json_serializable: ^6.13.0
  hive_ce_generator: ^1.11.1
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
